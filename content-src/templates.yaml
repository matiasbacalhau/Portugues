# Plantillas de gaps generados.
# Sin `kind` (generador `artigo`): cada instancia es "plantilla × lema que entra en la ranura".
#   - sin `prep`: el hueco es el artículo; tag = <tag_prefix>.masc|fem.
#   - con `prep`: el hueco es la contracción (no, na, do, da…); tag = <tag_prefix>.<prep>.
# `kind: presente`: cada instancia es "plantilla × sujeto" (Eu, Você, A Ana, A gente, Nós, Vocês, O Tom e a Mia);
#   el resto de la frase no puede depender de la persona (nada de adjetivos que concuerden).
# Criterio: TODA instancia tiene que ser algo que una persona diría (se leen todas al cambiar una plantilla o el léxico:
# `node tools/portuguese_texts.mjs | grep tpl-`). La ranura se ajusta con los campos del léxico.
# La frase fuerza el determinante (regla 11): "só um/uma" = una unidad; "me passa" = algo que está en la mesa.

