# Reglas de LanguageTool (pt-BR) que la app traduce. Los ids de gramática se agregan al verlos en las respuestas del
# servidor (tools/lt_check.py y el registro de la app): hasta entonces caen en `categories`.
# Cada `es` nombra la regla y nunca la forma correcta (regla 3). Sin `tag` = la regla se muestra pero no toca el mastery.
rules:
  MORFOLOGIK_RULE_PT_BR: {es: "Hay una palabra mal escrita: revisá su ortografía (ojo con las tildes y la ç)."}
  UPPERCASE_SENTENCE_START: {es: "Regla del comienzo de oración: la primera palabra se escribe de una manera especial."}
  DOUBLE_PUNCTUATION: {es: "Hay un signo de puntuación repetido."}
categories:
  CONFUSED_WORDS: "palabras fáciles de confundir"
  TYPOS: "ortografía"
  GRAMMAR: "gramática"
  CASING: "mayúsculas y minúsculas"
  PUNCTUATION: "puntuación"
  TYPOGRAPHY: "tipografía"
  REDUNDANCY: "palabra repetida"
  COLLOQUIALISMS: "lenguaje coloquial"
  REPETITIONS_STYLE: "estilo"
  STYLE: "estilo"
  REGIONALISMS: "variante de Portugal"
  FORMAL: "registro formal"
notice_categories: [STYLE, TYPOGRAPHY, REDUNDANCY, COLLOQUIALISMS, REPETITIONS_STYLE, FORMAL]
# Palabras que LanguageTool no conoce y que no son errores: si el corrector ortográfico marca una, no cuenta.
# Una palabra por entrada (LanguageTool marca de a una: "Buenos Aires" va como Buenos y Aires).
# Sin importar mayúsculas. Solo nombres que no existen en portugués: una palabra portuguesa mal escrita nunca va acá.
accepted_words:
  # Nombres en español
  - Matías
  - Mati
  - Santiago
  - Mateo
  - Martín
  - Nicolás
  - Joaquín
  - Tomás
  - Agustín
  - Lucía
  - Sofía
  # Personajes del curso
  - Leo
  - Tom
  - Mia
  - Lea
  - Rafa
  - Caju
  # Lugares de la Argentina y del Uruguay
  - Buenos
  - Aires
  - Rosario
  - Mendoza
  - Córdoba
  - Montevideo
  - Palermo
  - Rappi
# Catálogo cerrado del corrector de gramática (proxy/): el modelo solo puede devolver estas categorías.
# `hint` (inglés) va al modelo y nunca se muestra; `es` lo ve el usuario y nombra la regla sin la forma (regla 3).
llm_categories:
  ART_MASC: {tag: a1.genero.masc, es: "El artículo no corresponde al género de esta palabra en portugués, que no siempre es el del español: el género se aprende con cada sustantivo.", hint: "The article (or the article inside a contraction) of a masculine noun is feminine (for example 'a leite', 'na sal', 'uma sofá'). Many of these nouns are feminine in Spanish."}
  ART_FEM: {tag: a1.genero.fem, es: "El artículo no corresponde al género de esta palabra en portugués: las palabras en *-agem* son femeninas aunque en español terminen en *-aje*.", hint: "The article (or the article inside a contraction) of a feminine noun is masculine (for example 'o viagem', 'no mensagem', 'um cor'). Many of these nouns are masculine in Spanish."}
  CONTR_MISSING: {tag: a1.contr.em, es: "Preposición + artículo se contraen en una sola palabra en portugués: acá van separados.", hint: "A preposition (em, de, por, a) is written separately before a definite article where Brazilian Portuguese contracts them (for example 'em o quarto', 'de a Argentina', 'por o centro', 'a o banco'). Quote the preposition and the article together."}
  COUNTRY_ARTICLE: {tag: a1.contr.de, es: "Este país lleva artículo en portugués (o no lo lleva): la preposición cambia según eso.", hint: "A country name is used with the wrong article or contraction: countries such as o Brasil, a Argentina, o Chile, a Espanha take the article ('do Brasil', 'na Argentina'), while Portugal, Cuba, Angola do not ('de Portugal', not 'do Portugal'). Quote the preposition or contraction."}
  SER_ESTAR: {tag: a1.ser.estar, es: "*ser* y *estar* no reparten igual que en español en este caso: el hambre, el sueño y el frío se dicen con *estar com*, y dónde queda un lugar fijo, con *ficar* o *ser*.", hint: "Clearly wrong choice between ser and estar (for example 'Eu sou cansado hoje' for a temporary state, 'Eu sou com fome', 'Ela está argentina' for origin). Do not report 'estar' or 'ser' for the location of a fixed place: both are accepted there. Quote the verb."}
  SER_FORM: {tag: a1.ser.presente, es: "*ser* es irregular: cada persona tiene su forma. Revisá cuál pide el sujeto (*você* y *a gente* van con la de *ele*).", hint: "The form of 'ser' does not match the subject (for example 'eu é', 'você sou', 'nós são', 'a gente somos')."}
  ESTAR_FORM: {tag: a1.estar.presente, es: "*estar* cambia con cada persona: revisá cuál pide el sujeto (*você* y *a gente* van con la de *ele*).", hint: "The form of 'estar' does not match the subject (for example 'eu está', 'você estou', 'eles está')."}
  VERB_PERSON: {tag: a1.presente.regular, es: "El verbo cambia con cada persona: tiene que concordar con el sujeto (*você* y *a gente* van con la forma de *ele*).", hint: "A verb other than ser or estar has an ending that does not match the subject (for example 'eu mora', 'você moro', 'a gente moramos', 'eles fala')."}
  SPANISH_WORD: {es: "Esa palabra es de español (o se escribe así solo en español): en portugués es otra.", hint: "A Spanish word or a Spanish spelling used where Portuguese has a different word (for example 'pero' for 'mas', 'muy' for 'muito', 'yo' for 'eu', 'también' for 'também', 'calle' for 'rua', 'vivo en' for 'moro em', 'hay' for 'tem/há'). Quote the Spanish word."}
