# Léxico A1 de portugués de Brasil. freq: 1 = de las ~1000 más frecuentes (orden de FrequencyWords pt_br, CC BY-SA 4.0),
# 2 = frecuente, 3 = menos frecuente pero útil en la escena. `article`: o | a | null (países sin artículo).
# Los cambios de género respecto del español van marcados con `trap: genero` (o leite / la leche; a viagem / el viaje).
# Las imágenes son de OpenMoji (CC BY-SA 4.0), ya copiadas en images/openmoji/ con su crédito en data/credits.json.
# Verbos: `irregular` con las 4 personas de Brasil (eu, ele = você/ele/a gente, nos, eles = vocês/eles) solo donde no
# siguen la terminación regular; `tag` cuando el verbo tiene tema propio (ser, estar).

