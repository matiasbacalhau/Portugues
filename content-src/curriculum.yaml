tags:
  # ─────────────── A1 · Unidade 1 · Tema 1 ───────────────
  a1.pron.sujeito:
    title: "Pronombres de sujeto"
    requires: []
    orthographic: false
    rule: "El pronombre de sujeto tiene que corresponder a la persona de la que se habla (quién, cuántos, varón o mujer); en Brasil la forma de tratamiento y la de 'nosotros' coloquial conjugan en tercera persona del singular."
    rule_pt: "O pronome sujeito tem que corresponder à pessoa de quem se fala (quem, quantos, homem ou mulher); no Brasil, a forma de tratamento e o 'nós' coloquial se conjugam na terceira pessoa do singular."
    examples:
      - {pt: "Você é do Chile?", es: "¿Vos sos de Chile?", dims: {"person": "ele"}}
      - {pt: "A gente está no quarto.", es: "Estamos en el cuarto.", dims: {"person": "ele"}}
      - {pt: "Eu sou o Leo.", es: "Yo soy Leo.", dims: {"person": "eu"}}
      - {pt: "Nós somos amigos.", es: "Somos amigos.", dims: {"person": "nos"}}
      - {pt: "Vocês são muito legais.", es: "Ustedes son muy buena onda.", dims: {"person": "eles"}}
    curiosities:
      - "*você* viene de *vossa mercê* (vuestra merced), igual que *usted*: por eso conjuga en tercera persona."
      - "*a gente* significa *nosotros* en la charla de todos los días, pero el verbo va en singular: *a gente vai*."
  a1.ser.presente:
    title: "ser en presente"
    requires: [a1.pron.sujeito]
    orthographic: false
    rule: "*ser* es irregular: tiene una forma para *eu*, una para *você/ele/a gente*, una para *nós* y una para *vocês/eles*."
    rule_pt: "*ser* tem formas irregulares: uma para *eu*, uma para *você/ele/a gente*, uma para *nós* e uma para *vocês/eles*."
    examples:
      - {pt: "Eu sou argentino.", es: "Soy argentino.", dims: {"person": "eu"}}
      - {pt: "O Tom é do Canadá.", es: "Tom es de Canadá.", dims: {"person": "ele"}}
      - {pt: "Nós somos novos aqui.", es: "Somos nuevos acá.", dims: {"person": "nos"}}
      - {pt: "Elas são da Espanha.", es: "Ellas son de España.", dims: {"person": "eles"}}
  a1.estar.presente:
    title: "estar en presente"
    requires: [a1.pron.sujeito]
    orthographic: false
    rule: "*estar* tiene una forma para cada persona del presente; la de *você/ele* y la de *vocês/eles* llevan tilde en la última sílaba."
    rule_pt: "*estar* tem uma forma para cada pessoa do presente; as de *você/ele* e de *vocês/eles* têm acento na última sílaba."
    examples:
      - {pt: "Eu estou cansado.", es: "Estoy cansado.", dims: {"person": "eu"}}
      - {pt: "A Mia está na cozinha.", es: "Mia está en la cocina.", dims: {"person": "ele"}}
      - {pt: "Nós estamos atrasados.", es: "Estamos atrasados.", dims: {"person": "nos"}}
      - {pt: "Vocês estão com fome?", es: "¿Ustedes tienen hambre?", dims: {"person": "eles"}}
  a1.ser.estar:
    title: "ser, estar y ficar"
    requires: [a1.ser.presente, a1.estar.presente]
    orthographic: false
    rule: "*ser* va con la identidad, el origen y las características; *estar*, con los estados pasajeros y con el hambre, el sueño o el frío (con *com*); para ubicar un lugar fijo se usa sobre todo *ficar*."
    rule_pt: "*ser* indica identidade, origem e características; *estar*, estados passageiros e fome, sono ou frio (com *com*); para localizar um lugar fixo se usa sobretudo *ficar*."
    examples:
      - {pt: "O quarto é pequeno.", es: "El cuarto es chico.", dims: {"use": "ser"}}
      - {pt: "O quarto está bagunçado.", es: "El cuarto está desordenado.", dims: {"use": "estar"}}
      - {pt: "Estou com fome.", es: "Tengo hambre.", dims: {"use": "com"}}
      - {pt: "Onde fica o banheiro?", es: "¿Dónde queda el baño?", dims: {"use": "ficar"}}
    curiosities:
      - "En Brasil el hambre, el sueño, el frío y el apuro no se *tienen*: se *está con* ellos. *Estou com sono* es 'tengo sueño'."
      - "*ficar* tiene dos caras: 'quedar' (*Onde fica a praia?*) y 'ponerse' (*Fiquei feliz*: me puse contento)."

  # ─────────────── A1 · Unidade 1 · Tema 2 ───────────────
  a1.genero.masc:
    title: "Género: masculino"
    requires: []
    orthographic: false
    rule: "El artículo sigue el género del sustantivo en portugués, que no siempre es el del español: el género se aprende con cada palabra."
    rule_pt: "O artigo segue o gênero do substantivo em português, que nem sempre é o do espanhol: o gênero se aprende com cada palavra."
    examples:
      - {pt: "O leite está na geladeira.", es: "La leche está en la heladera.", dims: {"gender": "m"}}
      - {pt: "O sal está ali.", es: "La sal está ahí.", dims: {"gender": "m"}}
      - {pt: "A viagem foi longa.", es: "El viaje fue largo.", dims: {"gender": "f"}}
      - {pt: "A mensagem é do Tom.", es: "El mensaje es de Tom.", dims: {"gender": "f"}}
    curiosities:
      - "*o leite*, *o sal*, *o mel*, *o nariz*, *o sangue*: masculinos en portugués y femeninos en español. Son de los cambios de género más comunes."
  a1.genero.fem:
    title: "Género: femenino"
    requires: []
    orthographic: false
    rule: "El artículo sigue el género del sustantivo en portugués: las palabras en *-agem* son femeninas, aunque en español terminen en *-aje* y sean masculinas."
    rule_pt: "O artigo segue o gênero do substantivo em português: as palavras em *-agem* são femininas."
    examples:
      - {pt: "A viagem foi longa.", es: "El viaje fue largo.", dims: {"gender": "f"}}
      - {pt: "A cor do quarto é bonita.", es: "El color del cuarto es lindo.", dims: {"gender": "f"}}
      - {pt: "O leite está na geladeira.", es: "La leche está en la heladera.", dims: {"gender": "m"}}
      - {pt: "O sal está ali.", es: "La sal está ahí.", dims: {"gender": "m"}}
    curiosities:
      - "*-agem* = *-aje*, pero cambia de género: *a viagem* (el viaje), *a mensagem* (el mensaje), *a garagem* (el garaje), *a bagagem* (el equipaje)."
  a1.contr.em:
    title: "Contracción: em + artículo"
    requires: [a1.genero.masc, a1.genero.fem]
    orthographic: false
    rule: "La preposición de lugar se junta con el artículo en una sola palabra, que sigue el género y el número del sustantivo; nunca se escriben separados."
    rule_pt: "A preposição de lugar se junta ao artigo numa palavra só, que segue o gênero e o número do substantivo; nunca se escrevem separados."
    examples:
      - {pt: "O Tom está no quarto.", es: "Tom está en el cuarto.", dims: {"gender": "m"}}
      - {pt: "A toalha está na mochila.", es: "La toalla está en la mochila.", dims: {"gender": "f"}}
      - {pt: "As chaves estão nas mesas.", es: "Las llaves están en las mesas.", dims: {"number": "pl"}}
  a1.contr.de:
    title: "Contracción: de + artículo"
    requires: [a1.genero.masc, a1.genero.fem]
    orthographic: false
    rule: "La preposición de origen y pertenencia se junta con el artículo en una sola palabra; los países llevan artículo y se juntan con ella, salvo unos pocos sin artículo (*Portugal*, *Cuba*), que no tienen con qué juntarse."
    rule_pt: "A preposição de origem e posse se junta ao artigo numa palavra só; os países têm artigo e se juntam a ela, menos alguns sem artigo (*Portugal*, *Cuba*), que não têm com que se juntar."
    examples:
      - {pt: "A Mia é do Chile.", es: "Mia es de Chile.", dims: {"gender": "m"}}
      - {pt: "Eu sou da Argentina.", es: "Soy de Argentina.", dims: {"gender": "f"}}
      - {pt: "A chave do quarto está aqui.", es: "La llave del cuarto está acá.", dims: {"gender": "m"}}
    curiosities:
      - "En portugués casi todos los países llevan artículo: *o Brasil*, *a Argentina*, *o Chile*, *a Espanha*. Por eso *do Brasil*, *da Argentina*. Las excepciones más conocidas: *Portugal*, *Cuba*, *Moçambique*, *Angola*."

  # ─────────────── A1 · Unidade 1 · Tema 3 ───────────────
  a1.presente.regular:
    title: "Presente regular"
    requires: [a1.pron.sujeito]
    orthographic: false
    rule: "En el presente regular la terminación cambia con la persona y depende de si el verbo termina en *-ar*, *-er* o *-ir*; *você* y *a gente* van con la forma de *ele*."
    rule_pt: "No presente regular a terminação muda com a pessoa e depende de o verbo terminar em *-ar*, *-er* ou *-ir*; *você* e *a gente* vão com a forma de *ele*."
    examples:
      - {pt: "Eu moro em Buenos Aires.", es: "Vivo en Buenos Aires.", dims: {"person": "eu"}}
      - {pt: "Você fala espanhol?", es: "¿Hablás español?", dims: {"person": "ele"}}
      - {pt: "Nós comemos às oito.", es: "Comemos a las ocho.", dims: {"person": "nos"}}
      - {pt: "Eles abrem a loja cedo.", es: "Ellos abren el negocio temprano.", dims: {"person": "eles"}}
    curiosities:
      - "*morar* es 'vivir en un lugar' (*Eu moro no Rio*); *viver* es 'vivir' en general (*viver bem*). Un hispanohablante dice *vivo em…* y se entiende, pero suena a portuñol."
  a1.presente.irregular:
    title: "Presente irregular"
    requires: [a1.presente.regular]
    orthographic: false
    rule: "Algunos verbos muy usados no siguen las terminaciones regulares en alguna persona: esa forma se aprende de memoria."
    rule_pt: "Alguns verbos muito usados não seguem as terminações regulares em alguma pessoa: essa forma se aprende de cor."
  a1.som.nasal:
    title: "Vocales nasales"
    requires: []
    orthographic: false
    rule: "La tilde (*ã*, *õ*) y la *m* o *n* al final de la sílaba vuelven nasal la vocal: el aire sale también por la nariz, y eso cambia la palabra."
    rule_pt: "O til (*ã*, *õ*) e o *m* ou *n* no fim da sílaba tornam a vogal nasal: o ar sai também pelo nariz, e isso muda a palavra."
    examples:
      - {pt: "pão", es: "pan", dims: {"sound": "nasal"}}
      - {pt: "pau", es: "palo", dims: {"sound": "oral"}}
      - {pt: "lã", es: "lana", dims: {"sound": "nasal"}}
      - {pt: "lá", es: "allá", dims: {"sound": "oral"}}
  a1.som.abertas:
    title: "Vocales abiertas y cerradas"
    requires: []
    orthographic: false
    rule: "El portugués tiene una *e* y una *o* abiertas (*é*, *ó*) y otras cerradas (*ê*, *ô*): la diferencia cambia la palabra, y el acento escrito la marca."
    rule_pt: "O português tem um *e* e um *o* abertos (*é*, *ó*) e outros fechados (*ê*, *ô*): a diferença muda a palavra, e o acento escrito a marca."
    examples:
      - {pt: "avó", es: "abuela", dims: {"sound": "aberta"}}
      - {pt: "avô", es: "abuelo", dims: {"sound": "fechada"}}
      - {pt: "é", es: "es", dims: {"sound": "aberta"}}
      - {pt: "você", es: "vos", dims: {"sound": "fechada"}}

