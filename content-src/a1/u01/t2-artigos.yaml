              - {text: "A leite, a sal e o arroz.", rule: "Dos de esas palabras cambian de género respecto del español: el artículo tiene que seguirlas."}
              - {text: "As bananas e os tomates.", rule: "Esas cosas son de la feria, no del mercado: buscá la línea que empieza con *Do mercado*."}
            dims: {gender: m}
