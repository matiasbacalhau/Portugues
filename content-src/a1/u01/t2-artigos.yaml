          - {text: "Eu moro em Brasil desde criança.", rule: "*Brasil* lleva artículo en portugués: la preposición se junta con él."}
          - {text: "Eu moro na Brasil desde criança.", rule: "El artículo de *Brasil* no es femenino."}
