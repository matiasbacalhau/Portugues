# Tema 2: artículos, género y contracciones (em + artículo, de + artículo).
# Escena: la cocina compartida de la Pousada Maré y la feria del sábado en Santa Teresa.
# El foco está en lo que cambia respecto del español: sustantivos que cambian de género (o leite, o sal, a viagem,
# a mensagem, a cor), las contracciones obligatorias (no, na, do, da…) y los países con artículo (do Brasil, de Portugal).
# dims.gender: m | f (el género del sustantivo evaluado); dims.number: sg | pl cuando importa.
# `hides: [article]`: el glosario y las tarjetas no muestran el artículo mientras se practica este tema (regla 1).
topic: a1.u1.t2
tags: [a1.genero.masc, a1.genero.fem, a1.contr.em, a1.contr.de]
arbitrary: false
hides: [article]
ficha:
  short:
    - "Los artículos son casi los del español: *o*, *a*, *os*, *as* (el, la, los, las) y *um*, *uma*, *uns*, *umas* (un, una, unos, unas)."
    - "Casi siempre el género coincide con el español. Pero hay una lista corta de palabras que cambian, y son muy usadas: *o leite*, *o sal*, *o mel*, *o nariz*, *o sangue*, *o legume* son masculinas; *a viagem*, *a mensagem*, *a garagem*, *a bagagem* y *a cor* son femeninas."
    - "Regla de oro: las palabras en *-agem* (el *-aje* del español) son femeninas."
    - "*em* (en) y *de* + artículo se juntan en una sola palabra, siempre: *em + o = no*, *em + a = na*, *de + o = do*, *de + a = da* (y sus plurales). Nunca se escribe *em o* ni *de a*."
    - "Los países casi siempre llevan artículo: *o Brasil*, *a Argentina*, *o Chile*. Por eso *Sou da Argentina* y *Moro no Brasil*. Algunos no lo llevan, como *Portugal* o *Cuba*: *Sou de Portugal*."
  table:
    head: ["", "o", "a", "os", "as", "um", "uma"]
    rows:
      - ["em", "no", "na", "nos", "nas", "num / em um", "numa / em uma"]
      - ["de", "do", "da", "dos", "das", "de um", "de uma"]
  more:
    - "Por qué *o leite*. En latín *lac* era neutro. Al perderse el neutro, cada idioma lo mandó a un lado distinto: el castellano a *la leche*, el portugués a *o leite*. Lo mismo pasó con *sal*, *mel* y *sangue*. No es que el portugués sea caprichoso: el español tampoco tenía cómo saberlo."
    - "*-agem* y *-aje* vienen del francés *-age* (*voyage*, *message*), que es masculino. El castellano conservó el masculino; el portugués lo pasó al femenino. Por eso *a viagem* y *el viaje*, *a mensagem* y *el mensaje*: una regla con muy pocas excepciones."
    - "*a cor* (el color) y *a dor* (el dolor): en el portugués antiguo, y todavía en algún dialecto del castellano, *la color* y *la dolor* eran femeninas. El portugués las dejó así."
    - "Las contracciones no son opcionales. En español solo se juntan *a + el* y *de + el* (*al*, *del*). El portugués junta muchas más, y escribirlas separadas es tan raro como escribir *de el* en castellano."
    - "*num* y *numa* (*em um*, *em uma*) son comunísimas en el habla: *Moro num apartamento*. Por escrito, *em um* también es correcto. Las dos valen."
    - "Artículo con nombres de persona: en buena parte de Brasil se dice *o Tom*, *a Mia*, *a Ana*, igual que en algunos lugares de Argentina (*la Mia*). Por eso *a mochila da Mia* (de + a Mia). En el nordeste muchos lo dicen sin artículo: las dos formas son correctas."
    - "*o Rio*, *a Bahia* y *o Rio Grande do Sul* llevan artículo; *São Paulo*, *Brasília*, *Salvador* y casi todas las ciudades, no. *Moro em São Paulo*, pero *moro no Rio*."

steps:
  # ───────────────────────────── Etapa 1 ─────────────────────────────
  - n: 1
    name: "Descobrir"
    scene: {title: "A cozinha compartilhada", context: "Pousada Maré · 20:00 · todos cocinan a la vez y nadie encuentra nada"}
    exercises:
      - id: t2-1-det-em
        type: detective
        tag: a1.contr.em
        sentences:
          - {pt: "O sal está no armário.", highlight: "no"}
          - {pt: "A faca está na pia.", highlight: "na"}
          - {pt: "Os copos estão nos armários de cima.", highlight: "nos"}
          - {pt: "As colheres estão nas gavetas.", highlight: "nas"}
          - {pt: "O Tom está na varanda.", highlight: "na"}
        rules:
          - {text: "*em* y el artículo se juntan en una palabra, que sigue el género y el número del sustantivo.", correct: true}
          - {text: "*em* se junta con el artículo solo cuando el sustantivo es masculino."}
          - {text: "La palabra cambia según el verbo de la frase."}
          - {text: "Juntarlos es opcional: *em o* y *no* valen igual."}
        apply:
          - {text: "O leite está ___ geladeira.", answers: ["na"], dims: {gender: f}}
          - {text: "As chaves estão ___ sofá.", answers: ["no"], dims: {gender: m}}
          - {text: "Os pratos estão ___ mesas.", answers: ["nas"], dims: {gender: f, number: pl}}
        curiosities: ["El español junta solo *a + el* y *de + el*. El portugués junta casi todas las preposiciones cortas con el artículo."]
        reviewed: true

      - id: t2-1-det-de
        type: detective
        tag: a1.contr.de
        sentences:
          - {pt: "A Mia é do Chile.", highlight: "do"}
          - {pt: "Eu sou da Argentina.", highlight: "da"}
          - {pt: "A Lea é da Espanha.", highlight: "da"}
          - {pt: "O Tom é do Canadá.", highlight: "do"}
          - {pt: "A Dona Célia é de Portugal.", highlight: "de"}
        rules:
          - {text: "Los países llevan artículo y *de* se junta con él; si el país no lleva artículo, va *de* solo.", correct: true}
          - {text: "*de* se junta con el artículo solo con los países de América."}
          - {text: "La forma depende de si la persona es hombre o mujer."}
        apply:
          - {text: "O Rafa é ___ Brasil.", answers: ["do"], dims: {gender: m}}
          - {text: "Você é ___ Colômbia?", answers: ["da"], dims: {gender: f}}
        reviewed: true

      - id: t2-1-ch-leite
        type: choice
        tag: a1.genero.masc
        prompt: "La Lea busca algo para el café. ¿Qué pregunta?"
        options:
          - {text: "Onde está o leite?", correct: true}
          - {text: "Onde está a leite?", rule: "Esta palabra cambia de género respecto del español: en portugués no es femenina."}
          - {text: "Onde está la leite?", rule: "Esa forma del artículo es del español, no del portugués."}
        dims: {gender: m}
        curiosities: ["*o leite*, *o sal*, *o mel*: tres cosas de la cocina que en portugués son masculinas."]
        reviewed: true

      - id: t2-1-ch-viagem
        type: choice
        tag: a1.genero.fem
        prompt: "La Ana le pregunta a Dona Célia, que llegó de Lisboa, cómo le fue. Dona Célia contesta:"
        options:
          - {text: "A viagem foi ótima, obrigada.", correct: true}
          - {text: "O viagem foi ótimo, obrigada.", rule: "Las palabras en *-agem* (el *-aje* del español) tienen el otro género en portugués."}
          - {text: "O viaje foi ótimo, obrigada.", rule: "Esa palabra está en español: en portugués termina en *-agem* y cambia de género."}
        dims: {gender: f}
        reviewed: true

      - id: t2-1-ch-portugal
        type: choice
        tag: a1.contr.de
        prompt: "Dona Célia se presenta en la cocina. ¿Qué dice?"
        options:
          - {text: "Eu sou de Portugal.", correct: true}
          - {text: "Eu sou do Portugal.", rule: "*Portugal* es uno de los pocos países que no llevan artículo: no hay con qué contraer."}
          - {text: "Eu sou da Portugal.", rule: "*Portugal* no lleva artículo (y si lo llevara no sería femenino)."}
        dims: {gender: m}
        curiosities: ["*Portugal*, *Cuba*, *Angola* y *Moçambique* van sin artículo; casi todos los demás países lo llevan."]
        reviewed: true

      # Reserva
      - id: t2-1-det-genero
        type: detective
        tag: a1.genero.fem
        reserve: true
        sentences:
          - {pt: "A mensagem é da Mia.", highlight: "A"}
          - {pt: "A garagem está fechada.", highlight: "A"}
          - {pt: "A bagagem do Tom é enorme.", highlight: "A"}
          - {pt: "A viagem foi longa.", highlight: "A"}
        rules:
          - {text: "Las palabras en *-agem* son femeninas, aunque en español (*-aje*) sean masculinas.", correct: true}
          - {text: "Todas las palabras que terminan en *-m* son femeninas."}
          - {text: "El artículo es femenino porque la frase habla de una mujer."}
        apply:
          - {text: "___ passagem de ônibus custa cinco reais.", answers: ["A"], dims: {gender: f}}
          - {text: "Onde está ___ bagagem da Lea?", answers: ["a"], dims: {gender: f}}
        reviewed: true

