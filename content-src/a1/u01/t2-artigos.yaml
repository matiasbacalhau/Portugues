        text: |
          Bom dia, pessoal! Hoje é dia de feira. Esta é a lista para o jantar de sábado:
          Da feira: as bananas, os tomates, a cebola e o queijo minas. O peixe é do Seu Jorge, na barraca azul, no fim da rua.
          Do mercado: o leite, o sal e o arroz. O dinheiro está na caixa da cozinha, no armário de cima.
          A Mia faz a salada e o Tom faz o feijão. A sobremesa é da Lea: um bolo de chocolate!
          Até mais tarde,
          Ana
