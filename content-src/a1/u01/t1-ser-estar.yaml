# Tema 1: pronomes sujeito + ser + estar (+ ficar para lugares fijos).
# Escena: llegada a la Pousada Maré, en Santa Teresa (Rio de Janeiro).
# Personajes fijos: Leo (vos, de Rosario), Tom (Canadá, ronca, beliche de arriba), Mia (Chile), Lea (España),
# Ana y Rafa (recepción), Dona Célia (huésped mayor, se la trata de *a senhora*), Caju (el perro de la recepción).
# dims.person en los ítems de ser/estar: la forma del presente de Brasil (eu, ele = você/ele/a gente, nos, eles = vocês/eles),
# para que el "ejemplo distinto" del curriculum nunca muestre la misma forma.
# dims.use en los ítems de a1.ser.estar: ser | estar | com (estar com fome…) | ficar.
# Las escenas están en presente: los ítems cerrados de ser/estar aceptan solo formas de presente.
topic: a1.u1.t1
tags: [a1.pron.sujeito, a1.ser.presente, a1.estar.presente, a1.ser.estar]
arbitrary: false
hides: []
ficha:
  short:
    - "Como en español, el portugués tiene dos verbos: *ser* para lo que algo es (origen, profesión, cómo es) y *estar* para cómo está ahora o dónde está. Casi siempre reparten igual que en español."
    - "En Brasil se habla con *você*, que conjuga como *ele* (tercera persona), igual que *usted*. El *tu* existe, pero en buena parte del país casi no se oye, y con *você* nunca te equivocás."
    - "*a gente* quiere decir *nosotros* en la charla de todos los días, pero conjuga en singular, como *ele*: *a gente está cansado*. *nós* también se usa, sobre todo al escribir."
    - "El sujeto se puede omitir como en español (*Sou da Argentina*), pero con *você* conviene decirlo: *é* sirve para *você*, *ele*, *ela* y *a gente*, y sin pronombre no se sabe de quién hablás."
    - "Tres diferencias con el español: el hambre, el sueño, el frío y el apuro se dicen con *estar com* (*estou com fome*: tengo hambre); dónde queda un lugar fijo se dice sobre todo con *ficar* (*Onde fica o banheiro?*); y para tratar de usted a alguien mayor se usa *o senhor* / *a senhora*, que conjuga como *ele*."
  table:
    head: ["Persona", "ser", "estar", "en español"]
    rows:
      - ["eu", "sou", "estou", "yo soy / estoy"]
      - ["você · ele · ela · a gente", "é", "está", "vos sos / estás · él, ella es / está · nosotros (a gente)"]
      - ["o senhor · a senhora", "é", "está", "usted es / está"]
      - ["nós", "somos", "estamos", "nosotros somos / estamos"]
      - ["vocês · eles · elas", "são", "estão", "ustedes son / están · ellos, ellas son / están"]
  more:
    - "Por qué *você* conjuga como *ele*. Viene de *vossa mercê* (vuestra merced), que se fue gastando: *vossemecê*, *vosmecê*, *você*. Exactamente el mismo viaje que hizo *usted*. Por eso los dos conjugan en tercera persona."
    - "*Tu* en Brasil. Existe y en algunas regiones (el sur, partes del nordeste) se usa mucho, a menudo con el verbo de *você*: *tu é*. En Rio y São Paulo la mayoría dice *você*, que en la charla se acorta a *cê*: *Cê tá bem?*. Para empezar, *você* sirve en todo el país."
    - "*a gente* = *la gente* que se volvió *nosotros*. En la calle es más común que *nós*. Como nació de un sustantivo singular, el verbo va en singular: *a gente mora*, *a gente é*. Decir *a gente somos* es un error que se oye, pero que en un examen cuenta como error."
    - "La tilde no es decoración. *é* (es) y *e* (y) son palabras distintas; *está* (está) y *esta* (esta) también. Por eso en estos casos la app no te perdona la tilde."
    - "*estar com*: *estou com fome* (tengo hambre), *com sede* (sed), *com sono* (sueño), *com frio* (frío), *com calor*, *com pressa* (apuro), *com medo* (miedo). *Tenho fome* también existe, pero en Brasil suena a libro."
    - "*ficar* para ubicar lugares: *A praia fica perto* (la playa queda cerca). *Onde é o banheiro?* y *Onde está o banheiro?* también se dicen y se entienden; *fica* es lo más natural para algo que no se mueve."
    - "La edad se *tiene*, como en español: *Tenho 30 anos*. Y el estado civil se dice con *ser*: *Sou casado*, *sou solteiro* (en español rioplatense se suele decir *estoy casado*)."
    - "*o senhor* / *a senhora*: así se trata de usted a alguien mayor o en un contexto muy formal. Conjuga como *ele*: *A senhora está no quarto 3*. Entre gente joven, en una pousada, todo el mundo es *você*."

steps:
  # ───────────────────────────── Etapa 1 ─────────────────────────────
  - n: 1
    name: "Descobrir"
    scene: {title: "Chegada na pousada", context: "Pousada Maré, Santa Teresa · 22:15 · o bondinho já não funciona e você subiu o morro a pé, com a mochila", context_es: "Pousada Maré, Santa Teresa · 22:15 · el bondinho ya no anda y subiste la ladera a pie con la mochila"}
    exercises:
      - id: t1-1-det-ser
        type: detective
        tag: a1.ser.presente
        sentences:
          - {pt: "Eu sou o Leo.", highlight: "sou"}
          - {pt: "Você é a Ana, né?", highlight: "é"}
          - {pt: "O Tom é do Canadá.", highlight: "é"}
          - {pt: "Nós somos novos aqui.", highlight: "somos"}
          - {pt: "A gente é da mesma cidade!", highlight: "é"}
          - {pt: "Vocês são da Espanha?", highlight: "são"}
        rules:
          - {text: "La forma cambia según el sujeto, y *você* y *a gente* van con la misma que *ele*.", correct: true}
          - {text: "La forma cambia según la palabra que viene después."}
          - {text: "*você* y *a gente* tienen cada uno una forma propia."}
          - {text: "La forma cambia cuando la frase es una pregunta."}
        apply:
          - {text: "A Mia ___ do Chile.", answers: ["é"], dims: {person: ele}}
          - {text: "Eu ___ argentino.", answers: ["sou"], dims: {person: eu}}
          - {text: "Vocês ___ muito simpáticos.", answers: ["são"], dims: {person: eles}}
        curiosities: ["*é* (es) lleva tilde y *e* (y) no: dos palabras distintas que solo se diferencian en el acento."]
        reviewed: true

      - id: t1-1-det-estar
        type: detective
        tag: a1.estar.presente
        sentences:
          - {pt: "Eu estou cansado.", highlight: "estou"}
          - {pt: "Você está molhado!", highlight: "está"}
          - {pt: "A gente está na varanda.", highlight: "está"}
          - {pt: "Nós estamos no quarto 12.", highlight: "estamos"}
          - {pt: "O Tom e a Mia estão na cozinha.", highlight: "estão"}
        rules:
          - {text: "*estar* cambia según el sujeto: *você* y *a gente* comparten forma con *ele*, y *vocês* con *eles*.", correct: true}
          - {text: "*estar* cambia según si se habla de un lugar o de cómo está alguien."}
          - {text: "*estar* tiene la misma forma para todas las personas."}
        apply:
          - {text: "A gente ___ com fome.", answers: ["está"], dims: {person: ele}}
          - {text: "Eu ___ na recepção.", answers: ["estou"], dims: {person: eu}}
        curiosities: ["*está* (verbo) y *esta* (demostrativo) se diferencian solo por la tilde, que marca dónde cae el acento."]
        reviewed: true

      - id: t1-1-ch-voce
        type: choice
        tag: a1.pron.sujeito
        prompt: "A recepcionista sorri e quer confirmar se a reserva das dez é sua. O que ela diz?"
        prompt_es: "La recepcionista te sonríe y te pregunta si sos el de la reserva de las diez. ¿Qué te dice?"
        options:
          - {text: "Você é o Leo?", correct: true}
          - {text: "Você és o Leo?", rule: "*você* nació como forma de tratamiento (como *usted*) y conjuga en tercera persona, no en segunda."}
          - {text: "Você sou o Leo?", rule: "Esa forma de *ser* es la de *eu*; acá la recepcionista le habla a otra persona."}
          - {text: "Você somos o Leo?", rule: "Esa forma es la de *nós*; la recepcionista le habla a una sola persona."}
        dims: {person: ele}
        curiosities: ["*você* viene de *vossa mercê* (vuestra merced): por eso conjuga como *ele*, igual que *usted*."]
        reviewed: true

      - id: t1-1-ch-com-fome
        type: choice
        tag: a1.ser.estar
        prompt: "São 22:30 e você não come nada desde o aeroporto. Você diz para a Ana:"
        prompt_es: "Son las 22:30 y no comés desde el aeropuerto. Le decís a la Ana:"
        options:
          - {text: "Estou com muita fome.", correct: true}
          - {text: "Sou com muita fome.", rule: "El hambre es un estado de ahora, no algo que sos: va con el otro verbo."}
          - {text: "Estou muita fome.", rule: "En portugués el hambre no se *tiene* ni se *es*: se *está con* ella. Falta la preposición."}
          - {text: "Sou muita fome.", rule: "El hambre es un estado de ahora, no algo que sos, y además se dice con una preposición."}
        dims: {use: com}
        curiosities: ["En Brasil se *está con* hambre, sed, sueño, frío o apuro: *estou com sono* es 'tengo sueño'."]
        reviewed: true

      - id: t1-1-ch-senhora
        type: choice
        tag: a1.estar.presente
        prompt: "Chega a Dona Célia, uma senhora de setenta anos com duas malas. A Ana usa o tratamento formal e diz o número do quarto dela:"
        prompt_es: "Llega Dona Célia, una señora de setenta años con dos valijas. La Ana la trata de usted y le dice en qué cuarto está:"
        options:
          - {text: "A senhora está no quarto 3.", correct: true}
          - {text: "A senhora estás no quarto 3.", rule: "*a senhora* es una forma de tratamiento, como *usted*: conjuga en tercera persona."}
          - {text: "A senhora estou no quarto 3.", rule: "Esa forma es la de *eu*; la Ana habla de otra persona."}
          - {text: "A senhora estão no quarto 3.", rule: "Esa forma es la del plural; Dona Célia es una sola persona."}
        dims: {person: ele}
        reviewed: true

      # Reserva
      - id: t1-1-det-ser-b
        type: detective
        tag: a1.ser.presente
        reserve: true
        sentences:
          - {pt: "Eu sou a Mia.", highlight: "sou"}
          - {pt: "Você é o Tom, né?", highlight: "é"}
          - {pt: "A pousada é pequena.", highlight: "é"}
          - {pt: "Nós somos do Chile.", highlight: "somos"}
          - {pt: "Vocês são muito barulhentos!", highlight: "são"}
        rules:
          - {text: "La forma depende del sujeto: *eu*, *nós* y *vocês* tienen la suya, y *você*, *ele* y *ela* comparten una.", correct: true}
          - {text: "La forma depende del género del sustantivo que viene después."}
          - {text: "La forma depende de si se habla de una cosa o de una persona."}
        apply:
          - {text: "O quarto ___ muito bonito.", answers: ["é"], dims: {person: ele}}
          - {text: "Eu e a Lea ___ amigas.", answers: ["somos"], dims: {person: nos}}
        reviewed: true


  # ───────────────────────────── Etapa 2 ─────────────────────────────
  - n: 2
    name: "Reconhecer"
    scene: {title: "Na recepção", context: "22:20 · a Ana fala muito rápido e o Caju, o cachorro, cheira a sua mochila", context_es: "22:20 · la Ana habla rapidísimo y Caju, el perro, te huele la mochila"}
    exercises:
      - id: t1-2-ord-banheiro
        type: order
        tag: a1.ser.estar
        prompt: "Pergunte à Ana pelo banheiro, como um brasileiro."
        prompt_es: "Preguntale a la Ana por el baño, como lo diría un brasileño."
        chunks: ["fica", "onde", "o banheiro"]
        answers: [["onde", "fica", "o banheiro"]]
        dims: {use: ficar}
        reviewed: true

      - id: t1-2-ch-cansado
        type: choice
        tag: a1.ser.estar
        prompt: "A Ana vê a sua cara e pergunta se tudo bem. O que você responde?"
        prompt_es: "La Ana te ve la cara y te pregunta si estás bien. ¿Qué le contestás?"
        options:
          - {text: "Estou muito cansado.", correct: true}
          - {text: "Sou muito cansado.", rule: "Con el otro verbo diría que sos una persona cansada por naturaleza; hablás de cómo estás hoy."}
          - {text: "Tenho muito cansado.", rule: "El cansancio no se tiene: es un estado, y va con el verbo de los estados."}
        dims: {use: estar}
        reviewed: true

      - id: t1-2-se-toalhas
        type: spot-error
        tag: a1.estar.presente
        prompt: "A Ana entrega um papelzinho com as informações do quarto. Tem um erro."
        prompt_es: "La Ana te pasa un papelito con la info del cuarto. Tiene un error."
        tokens: ["As", "toalhas", "está", "no", "armário."]
        wrong: 2
        corrections: ["estão"]
        rule: "El sujeto es plural: *estar* tiene que ir en la forma de plural."
        dims: {person: eles}
        reviewed: true

      - id: t1-2-ord-de-onde
        type: order
        tag: a1.ser.presente
        prompt: "A Ana quer saber a sua origem."
        prompt_es: "La Ana quiere saber de dónde sos."
        chunks: ["é", "você", "de onde"]
        answers: [["de onde", "você", "é"], ["de onde", "é", "você"]]
        dims: {person: ele}
        reviewed: true

      - id: t1-2-se-voce-esta
        type: spot-error
        tag: a1.pron.sujeito
        prompt: "Mensagem do Rafa, o outro recepcionista. Tem um erro."
        prompt_es: "Mensaje de Rafa, el otro recepcionista. Tiene un error."
        tokens: ["Oi,", "Leo!", "Você", "estás", "no", "quarto", "12."]
        wrong: 3
        corrections: ["está"]
        rule: "*você* conjuga en tercera persona, como *usted*: la forma de segunda no va con *você*."
        dims: {person: ele}
        reviewed: true

      - id: t1-2-ord-senha
        type: order
        tag: a1.ser.presente
        prompt: "O mais importante: o wi-fi."
        prompt_es: "Lo más importante: el wifi."
        chunks: ["a senha", "qual", "do wi-fi", "é"]
        answers: [["qual", "é", "a senha", "do wi-fi"]]
        dims: {person: ele}
        reviewed: true

      - id: t1-2-se-a-gente
        type: spot-error
        tag: a1.pron.sujeito
        prompt: "Mensagem da Mia para o grupo. Tem um erro."
        prompt_es: "Mensaje de la Mia al grupo. Tiene un error."
        tokens: ["A", "gente", "estamos", "na", "varanda.", "Vem!"]
        wrong: 2
        corrections: ["está"]
        rule: "*a gente* significa *nosotros*, pero el verbo va en singular, como con *ele*."
        dims: {person: ele}
        reviewed: true

      - id: t1-2-ord-cafe
        type: order
        tag: a1.ser.presente
        prompt: "Você não come desde o avião. Pergunte o horário do café da manhã."
        prompt_es: "Tenés hambre desde el avión. Preguntá a qué hora es el desayuno."
        chunks: ["que horas", "o café da manhã", "é", "a"]
        answers: [["a", "que horas", "é", "o café da manhã"]]
        dims: {person: ele}
        reviewed: true

      - id: t1-2-se-ser-cansada
        type: spot-error
        tag: a1.ser.estar
        prompt: "Mensagem da Lea, que acabou de chegar. Tem um erro."
        prompt_es: "Mensaje de la Lea, que llegó hace cinco minutos. Tiene un error."
        tokens: ["Gente,", "eu", "sou", "muito", "cansada", "hoje."]
        wrong: 2
        corrections: ["estou", "tô"]
        rule: "*hoje* muestra que es un estado de ahora, no algo que la Lea es siempre: va con el otro verbo."
        dims: {use: estar}
        reviewed: true

      - id: t1-2-ord-tom
        type: order
        tag: a1.estar.presente
        prompt: "A Ana procura o Tom, o seu colega de quarto. Responda."
        prompt_es: "Contale a la Ana dónde está tu compañero de cuarto."
        chunks: ["no quarto", "o Tom", "está"]
        answers: [["o Tom", "está", "no quarto"], ["no quarto", "está", "o Tom"]]
        dims: {person: ele}
        reviewed: true

      - id: t1-2-se-somos-sao
        type: spot-error
        tag: a1.ser.presente
        prompt: "A Ana fala dos seus colegas de quarto. Tem um erro."
        prompt_es: "La Ana te cuenta de tus compañeros de cuarto. Tiene un error."
        tokens: ["O", "Tom", "e", "a", "Mia", "é", "muito", "legais."]
        wrong: 5
        corrections: ["são"]
        rule: "*o Tom e a Mia* son dos personas: el sujeto es plural y *ser* tiene que ir en plural."
        dims: {person: eles}
        reviewed: true

      - id: t1-2-ord-praia
        type: order
        tag: a1.ser.estar
        prompt: "Você quer saber a distância até a praia."
        prompt_es: "Querés saber si la playa queda cerca."
        chunks: ["perto", "a praia", "fica"]
        answers: [["a praia", "fica", "perto"]]
        dims: {use: ficar}
        reviewed: true

      - id: t1-2-ch-ser-origem
        type: choice
        tag: a1.ser.estar
        prompt: "O Rafa pergunta a origem da Mia. O que ela responde?"
        prompt_es: "Rafa le pregunta a la Mia de dónde es. ¿Qué contesta?"
        options:
          - {text: "Eu sou do Chile.", correct: true}
          - {text: "Eu estou do Chile.", rule: "El origen es parte de lo que alguien es, no un estado: va con el otro verbo."}
          - {text: "Eu fico do Chile.", rule: "*ficar* sirve para ubicar lugares o para 'quedarse'; el origen va con otro verbo."}
        dims: {use: ser}
        reviewed: true

      - id: t1-2-se-voces-esta
        type: spot-error
        tag: a1.estar.presente
        prompt: "Aviso pendurado na porta da cozinha. Tem um erro."
        prompt_es: "Cartelito en la puerta de la cocina. Tiene un error."
        tokens: ["Pessoal,", "vocês", "está", "convidados", "para", "o", "jantar!"]
        wrong: 2
        corrections: ["estão"]
        rule: "*vocês* es plural: *estar* va en la forma de plural, la misma que con *eles*."
        dims: {person: eles}
        reviewed: true

      # Reserva
      - id: t1-2-ord-recepcao
        type: order
        tag: a1.ser.estar
        reserve: true
        prompt: "Você se perdeu de novo no corredor."
        prompt_es: "Volviste a perderte en el pasillo."
        chunks: ["a recepção", "onde", "fica"]
        answers: [["onde", "fica", "a recepção"]]
        dims: {use: ficar}
        reviewed: true

      - id: t1-2-se-eu-esta
        type: spot-error
        tag: a1.estar.presente
        reserve: true
        prompt: "A sua mensagem para o grupo, escrita com sono. Tem um erro."
        prompt_es: "Tu mensaje al grupo, escrito con sueño. Tiene un error."
        tokens: ["Eu", "está", "na", "cama.", "Boa", "noite!"]
        wrong: 1
        corrections: ["estou", "tô"]
        rule: "Esa forma es la de *você* y *ele*; el sujeto sos vos mismo."
        dims: {person: eu}
        reviewed: true

      - id: t1-2-ord-nomes
        type: order
        tag: a1.ser.presente
        reserve: true
        prompt: "Duas meninas novas chegam. Você quer conhecer as duas (use *ser*)."
        prompt_es: "Les preguntás a dos chicas nuevas cómo se llaman (con *ser*)."
        chunks: ["vocês", "quem", "são"]
        answers: [["quem", "são", "vocês"]]
        dims: {person: eles}
        reviewed: true

      - id: t1-2-se-caju
        type: spot-error
        tag: a1.ser.presente
        reserve: true
        prompt: "Aviso da recepção. Tem um erro."
        prompt_es: "Cartel de la recepción. Tiene un error."
        tokens: ["O", "Caju", "são", "o", "cachorro", "da", "pousada."]
        wrong: 2
        corrections: ["é"]
        rule: "Caju es uno solo: el sujeto es singular y *ser* va en singular."
        dims: {person: ele}
        reviewed: true

  # ───────────────────────────── Etapa 3 ─────────────────────────────
  - n: 3
    name: "Aplicar no contexto"
    scene: {title: "Um e-mail da pousada", context: "No dia seguinte · 9:30 · chegou um e-mail com as regras da casa", context_es: "Al día siguiente · 9:30 · llegó un mail con las reglas de la casa"}
    generated: 3
    exercises:
      - id: t1-3-read-regras
        type: reading
        title: "Bem-vindos à Pousada Maré!"
        text: |
          Olá, pessoal! Bem-vindos à Pousada Maré!
          Nós somos a Ana e o Rafa, da recepção. Aqui estão as regras da casa:
          A recepção fica no térreo e está aberta das 7h às 23h. O café da manhã é das 7h às 10h, na varanda. O silêncio é das 22h às 7h. O cachorro da recepção é o Caju. Ele é muito carinhoso, mas não é um travesseiro! Vocês estão com alguma dúvida? A gente está sempre aqui.
          Um abraço,
          Ana e Rafa
        questions:
          - tag: a1.ser.presente
            prompt: "Quem é o Caju?"
            answers: ["O cachorro da recepção", "É o cachorro da recepção", "O Caju é o cachorro da recepção", "Ele é o cachorro da recepção", "O cachorro", "É o cachorro", "Um cachorro", "É um cachorro", "O cachorro da pousada", "É o cachorro da pousada"]
            dims: {person: ele}
          - tag: a1.ser.estar
            prompt: "Onde fica a recepção?"
            options:
              - {text: "No térreo.", correct: true}
              - {text: "Na varanda.", rule: "La pregunta es dónde queda la recepción: la varanda es el lugar de otra regla de la casa."}
              - {text: "No quarto 12.", rule: "El mail no habla de ese cuarto: buscá la frase con *fica*."}
            dims: {use: ficar}
          - tag: a1.ser.presente
            prompt: "Quando é o café da manhã?"
            options:
              - {text: "Das 7h às 10h.", correct: true}
              - {text: "Das 22h às 7h.", rule: "Ese horario es de otra regla de la casa: fijate cuál va con el desayuno."}
              - {text: "Das 7h às 23h.", rule: "Ese horario es de otra regla de la casa: fijate cuál va con el desayuno."}
            dims: {person: ele}
          - tag: a1.ser.estar
            prompt: "O Caju é um travesseiro?"
            options:
              - {text: "Não, ele é um cachorro.", correct: true}
              - {text: "Não, ele está um cachorro.", rule: "Lo que alguien es (un perro, una persona) no es un estado: va con el otro verbo."}
              - {text: "Sim, ele é muito carinhoso.", rule: "Leé de nuevo la frase sobre el Caju y el travesseiro: tiene un *não*."}
            dims: {use: ser}
        reviewed: true

      - id: t1-3-se-senhora
        type: spot-error
        tag: a1.estar.presente
        prompt: "Resposta da pousada para a Dona Célia, que escreveu de um jeito muito formal. Tem um erro."
